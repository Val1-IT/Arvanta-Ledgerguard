name: CI

on:
  push:
  pull_request:

# Node 20 reached end-of-life in April 2026. It stays in the matrix for now
# (README engines still say >=20) unless a job fails on it. Unit tests and
# PostgreSQL integration also run on Node 22 and 24. The Ubuntu/Windows
# fresh-clone demo job stays on Node 20 so that smoke path does not multiply
# by runtime version.

jobs:
  demo:
    name: Fresh-clone demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bootstrap and verify demo without prior install or environment file
        run: pnpm demo
      - name: Repeat demo
        run: pnpm demo

  unit:
    name: Unit and packages (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Unit tests (no DataHub, no Postgres)
        run: pnpm run test
      - name: Build
        run: pnpm run build

  integration:
    name: PostgreSQL integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerguard
          POSTGRES_PASSWORD: ledgerguard
          POSTGRES_DB: ledgerguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerguard -d ledgerguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ledgerguard:ledgerguard@localhost:5432/ledgerguard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate
        run: pnpm run db:migrate
      - name: Integration tests
        run: pnpm run test:integration
