name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ledgerguard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Fresh-clone demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bootstrap and verify demo without prior install or environment file
        run: pnpm demo
      - name: Repeat demo
        run: pnpm demo

  unit:
    name: Unit and packages (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit runtime dependency advisories
        run: pnpm audit --prod --audit-level=high
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Unit tests (no DataHub, no Postgres)
        run: pnpm run test
      - name: Build
        run: pnpm run build

  integration:
    name: PostgreSQL integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerguard
          POSTGRES_PASSWORD: ledgerguard
          POSTGRES_DB: ledgerguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerguard -d ledgerguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ledgerguard:ledgerguard@localhost:5432/ledgerguard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate
        run: pnpm run db:migrate
      - name: Integration tests
        run: pnpm run test:integration

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the pnpm workspace production image
        run: docker build --tag ledgerguard:ci .
      - name: Verify standalone server exists in the image
        run: docker run --rm ledgerguard:ci node --check server.js
      - name: Start image and verify the HTTP server responds
        run: |
          docker run --detach --name ledgerguard-smoke --publish 127.0.0.1:3000:3000 --env DEMO_MODE=true ledgerguard:ci
          for attempt in $(seq 1 30); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/_not-found || true)"
            if [ "$code" = 404 ]; then exit 0; fi
            sleep 2
          done
          docker logs ledgerguard-smoke
          exit 1
      - name: Stop disposable image
        if: always()
        run: docker rm --force ledgerguard-smoke || true
