name: Odoo 19 integration

on:
  pull_request:
  push:
    paths:
      - 'packages/odoo/**'
      - 'packages/core/src/ports/constrained-action.ts'
      - 'packages/core/src/lifecycle/execute-constrained-action.ts'
      - 'src/remediation/execute-remote-action.ts'
      - 'docker-compose.odoo.yml'
      - '.github/workflows/odoo.yml'
      - 'scripts/odoo-ci-bootstrap.sh'

jobs:
  odoo:
    name: Odoo 19 Community JSON-2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Odoo package unit tests
        run: pnpm --filter @ledgerguard/odoo test
      - name: Start Odoo 19 and bootstrap API key
        id: bootstrap
        run: |
          chmod +x scripts/odoo-ci-bootstrap.sh
          KEY="$(bash scripts/odoo-ci-bootstrap.sh | tail -n 1)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Live JSON-2 and control-plane tests
        env:
          ODOO_BASE_URL: http://127.0.0.1:8069
          ODOO_DATABASE: odoo
          ODOO_API_KEY: ${{ steps.bootstrap.outputs.key }}
        run: |
          pnpm --filter @ledgerguard/odoo exec vitest run test/live.integration.test.ts
          pnpm exec vitest run --config vitest.odoo.config.ts
