services:
  odoo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    ports:
      - "5434:5432"
  odoo:
    image: odoo:19
    depends_on:
      - odoo-db
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    command: -- --db_host=odoo-db --db_user=odoo --db_password=odoo --db_name=odoo --without-demo=False
